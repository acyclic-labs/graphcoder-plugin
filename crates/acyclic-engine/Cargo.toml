[package]
name = "acyclic-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
build = "build.rs"
description = "Rewind engine: capture pipeline, checkpoint index, rewind, and diff over acyclic-fs"

[dependencies]
acyclic-fs.workspace = true
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
hex = "0.4"
blake3 = "1"
bytes = "1"
diffy = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
