[package]
name = "acyclic-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Rewind engine: capture pipeline, checkpoint index, rewind, and diff over acyclic-fs"

[dependencies]
acyclic-fs.workspace = true
acyclic-fs-mount.workspace = true
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
hex = "0.4"
blake3 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
bytes = "1"
tempfile = "3"
