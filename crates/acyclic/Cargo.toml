[package]
name = "acyclic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
description = "Agent-native state engine: checkpoints, rewind, and blast-radius diff for coding-agent sessions"

[dependencies]
acyclic-engine = { path = "../acyclic-engine" }
acyclic-fs.workspace = true
acyclic-proto = { path = "../acyclic-proto" }
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
