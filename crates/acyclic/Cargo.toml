[package]
name = "acyclic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false
build = "build.rs"
description = "Agent-native state engine: checkpoints, rewind, and blast-radius diff for coding-agent sessions"

[dependencies]
acyclic-fs.workspace = true
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.3.0", features = ["server", "macros", "transport-io", "schemars"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
toml = "0.8"
thiserror = "2"
hex = "0.4"
blake3 = "1"
bytes = "1"
diffy = "0.4"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Handle-inheritance control for the daemon spawn (`client::spawn_daemon`),
# the security descriptor that keeps the daemon's named pipe to this user
# (`ipc::Listener::bind`), and the job object that makes a speculative run's
# timeout reach the child's own children (`spec_runner::RunGroup`).
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
toml = "0.8"

[lints]
workspace = true
