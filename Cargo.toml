[workspace]
resolver = "2"
members = [
  "crates/acyclic",
  "crates/acyclic-engine",
  "crates/acyclic-proto",
  "crates/acyclic-qual",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/acyclic-labs/graphcoder-plugin"
homepage = "https://acyclic.dev"

[workspace.dependencies]
acyclic-fs = { git = "https://github.com/acyclic-labs/sdk.git", rev = "8eced489729235929b769e831c1170c85aa1f7ba", features = ["local", "native-watch", "native-mount"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }

# Code-quality guards beyond clippy's defaults. CI runs clippy with
# `-D warnings`, so every "warn" here fails the build. Each crate opts in
# with `[lints] workspace = true`. Thresholds live in clippy.toml.
[workspace.lints.clippy]
# Size and shape: a function that outgrows a screen, or a match whose arms
# are copy-pasted, is where the next bug hides. Existing dispatchers that
# are one arm per protocol op carry an explicit `allow` with a reason.
too_many_lines = "warn"
cognitive_complexity = "warn"
match_same_arms = "warn"
single_match_else = "warn"
manual_let_else = "warn"
if_not_else = "warn"
# Ownership and cost: clones and by-value arguments that aren't needed.
redundant_clone = "warn"
needless_pass_by_value = "warn"
inefficient_to_string = "warn"
str_to_string = "warn"
map_unwrap_or = "warn"
# Never in committed code.
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
# Docs read as prose: identifiers in backticks, no stray semicolons.
doc_markdown = "warn"
missing_panics_doc = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
# Type safety: no hidden panics on Option/Result or out-of-range indexes in
# non-test code (tests opt back in per crate with cfg_attr), and no lossy
# numeric casts without a `try_from` or an `allow` that says why it's safe.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unwrap_in_result = "warn"
indexing_slicing = "warn"
string_slice = "warn"
fallible_impl_from = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_lossless = "warn"

[workspace.lints.rust]
# Every `unsafe` block carries an `allow(unsafe_code, reason = ...)` on its
# function naming the invariant, so a reviewer can find them all.
unsafe_code = "warn"
unsafe_op_in_unsafe_fn = "warn"

