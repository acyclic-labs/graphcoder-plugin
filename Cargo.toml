[workspace]
resolver = "2"
members = [
  "crates/acyclic",
  "crates/acyclic-engine",
  "crates/acyclic-proto",
  "crates/acyclic-qual",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
acyclic-fs = { git = "https://github.com/acyclic-labs/sdk.git", rev = "bf1a8017b47a25d2e499aa74761b7fd5bfb3388a", features = ["local", "native-watch", "native-mount"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros"] }

